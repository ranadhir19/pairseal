[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairseal"
version = "0.1.0"
description = "Free, verified field extraction from document images (invoices, bank checks, flyers, receipts, forms): two independent vision-model reads must agree before any field is sealed; everything else is a reason-coded refusal. Bring your own provider keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["document-extraction", "invoice", "receipt", "flyer", "vision-llm", "document-understanding", "information-extraction", "verification", "agreement-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = []

[project.optional-dependencies]
selftest = ["Pillow>=10"]

[project.scripts]
pairseal = "pairseal.cli:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/pairseal"

[tool.setuptools.packages.find]
where = ["src"]
